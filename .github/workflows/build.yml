# Builds FlappyCrix.dll with Mono against the real BepInEx DLL and the reference
# stand-ins in tools/refs, then packages the plugin folder.
# Push a tag like v1.1.0 to publish a GitHub Release with the zip attached.
# (This mod was made with AI - Claude by Anthropic.)
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel

      - name: Get BepInEx reference
        run: tools/get_bepinex.sh

      - name: Build FlappyCrix.dll
        run: tools/refs/build_dll.sh

      - name: Package plugin folder
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="dev-${GITHUB_SHA::7}";; esac
          cd mod && zip -qr "../FlappyCrix-v${VERSION}.zip" FlappyCrix
          ls -la ../FlappyCrix-v*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyCrix
          path: FlappyCrix-v*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlappyCrix-v*.zip
          body: |
            Flappy Crix for Gorilla Tag ${{ github.ref_name }}.
            🤖 This mod was made with AI (Claude by Anthropic).
            Unzip into `Gorilla Tag/BepInEx/plugins/`. The browser engine (UWB folder) is installed separately - see the README.
