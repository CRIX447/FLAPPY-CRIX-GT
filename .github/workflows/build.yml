# Builds FlappyCrix.dll with Mono against the real BepInEx DLL and the reference
# stand-ins in tools/refs, checks it (start-up without the optional engine, and every
# Unity call against Unity's own source), then packages the plugin folder.
# Push a version tag (e.g. v1.0.0) to publish a GitHub Release with the zip attached.
# (This mod was made with AI - Claude by Anthropic.)
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel

      - name: Get BepInEx reference
        run: tools/get_bepinex.sh

      - name: Build FlappyCrix.dll
        run: tools/refs/build_dll.sh

      - name: Start-up check (loads the DLL like a normal install, without UnityWebBrowser)
        run: tools/load-check/run.sh

      - name: Live-site behaviour (the mod's website engine vs a slow / down / stalled stand-in site)
        run: tools/live-harness/run.sh "$(command -v google-chrome || command -v chromium)"

      - name: Unity API audit (every Unity call checked against Unity's own source)
        run: |
          tools/api-audit/run.sh mod/FlappyCrix/FlappyCrix.dll 2022.3
          tools/api-audit/run.sh mod/FlappyCrix/FlappyCrix.dll 2021.3

      - name: Package plugin folder
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="dev-${GITHUB_SHA::7}";; esac
          cd mod && zip -qr "../FlappyCrix-v${VERSION}.zip" FlappyCrix
          ls -la ../FlappyCrix-v*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyCrix
          path: FlappyCrix-v*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlappyCrix-v*.zip
          body: |
            Flappy Crix for Gorilla Tag ${{ github.ref_name }}.
            🤖 This mod was made with AI (Claude by Anthropic).
            Unzip into `Gorilla Tag/BepInEx/plugins/`. The website runs in the Microsoft Edge (or Chrome) already on
            your PC, hidden - nothing else to install. See the README.
